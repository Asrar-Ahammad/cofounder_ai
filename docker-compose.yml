services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cofunder-postgres
    restart: always
    environment:
      POSTGRES_USER: cofunder
      POSTGRES_PASSWORD: cofunder
      POSTGRES_DB: cofunder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cofunder -d cofunder"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cofunder-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: cofunder-mailpit
    restart: always
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  pgdata:
  redisdata:
